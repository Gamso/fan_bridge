name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The bundle is not committed (the release builds it): just make sure
      # the sources build.
      - name: Build
        run: |
          npm run build
          test -s custom_components/fan_bridge/www/fan-bridge-card.js

  integration:
    name: Integration tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The integration serves the card bundle, which is not committed: build
      # it for the tests that load it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the card
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt

      - name: Lint
        run: ruff check custom_components tests

      - name: Test
        run: pytest -v --tb=short

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
