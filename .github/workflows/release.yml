name: Release

# Push a tag named after the version (v1.1.0) to publish a GitHub release,
# which is what HACS offers as an update.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches every version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in package.json custom_components/fan_bridge/manifest.json; do
            found="$(jq -r .version "$file")"
            if [ "$found" != "$version" ]; then
              echo "::error file=$file::version $found does not match tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
          grep -q "CARD_VERSION = \"$version\"" src/version.ts \
            || { echo "::error file=src/version.ts::CARD_VERSION does not match tag $GITHUB_REF_NAME"; exit 1; }

      # The notes are the CHANGELOG section of this version.
      - name: Extract the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 == v {found=1; next} /^## / && found {exit} found' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error file=CHANGELOG.md::no section '## $version'"
            exit 1
          fi

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "FanBridge $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
